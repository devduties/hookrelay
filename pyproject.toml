[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hookrelay"
version = "0.1.0"
description = "A small, inspectable webhook delivery service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.24,<2.0", "ruff>=0.8,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hookrelay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".uv-cache", ".venv", ".pytest-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
